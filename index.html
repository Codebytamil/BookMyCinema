<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BookMyCinema</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f1115; color: #fff; }
  header { background: #e50914; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; position: sticky; top: 0; z-index: 10; }
  .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .section { display: none; }
  .section.active { display: block; }

  /* Login */
  input { padding: 10px; border-radius: 6px; border: none; margin: 6px 0; width: 100%; font-size: 15px; }
  button { background: #e50914; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #ff1f2c; }
  button:disabled { background: #444; cursor: not-allowed; }
  .back-btn { background: transparent; border: 1px solid #666; margin-bottom: 16px; }

  /* Movie grid with posters */
  .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px; }
  .movie-card { background: #1c1f26; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.15s; }
  .movie-card:hover { transform: translateY(-4px); }
  .movie-card img { width: 100%; height: 260px; object-fit: cover; display: block; background: #333; }
  .movie-card .info { padding: 12px; }
  .movie-card h3 { font-size: 16px; margin-bottom: 4px; }
  .movie-card p { color: #aaa; font-size: 12px; margin-bottom: 6px; }
  .movie-card .price-tag { color: #4caf50; font-weight: bold; font-size: 14px; }

  /* Shows list per movie */
  .show-list { margin-top: 16px; }
  .show-item { background: #1c1f26; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .show-item div p { color: #aaa; font-size: 13px; }

  /* Seat map */
  .screen-label { text-align: center; background: linear-gradient(to bottom, #444, transparent); padding: 8px; margin: 20px auto; width: 80%; border-radius: 4px; color: #ccc; font-size: 12px; letter-spacing: 2px; }
  .seat-map-wrapper { max-height: 420px; overflow-y: auto; overflow-x: auto; background: #14161b; border-radius: 8px; padding: 16px; }
  .seat-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .row-label { width: 22px; color: #777; font-size: 12px; text-align: right; margin-right: 4px; }
  .seat-icon { width: 26px; height: 26px; border-radius: 5px 5px 8px 8px; background: #2a2e37; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #999; flex-shrink: 0; border: 1px solid #3a3f4a; }
  .seat-icon:hover:not(.booked) { background: #4a4f5a; }
  .seat-icon.selected { background: #e50914; border-color: #ff5a63; color: #fff; }
  .seat-icon.booked { background: #333; color: #555; cursor: not-allowed; border-color: #333; }
  .legend { display: flex; gap: 20px; margin-top: 14px; font-size: 12px; color: #aaa; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .box { width: 16px; height: 16px; border-radius: 3px; display: inline-block; }

  .summary { background: #1c1f26; padding: 16px; border-radius: 8px; margin-top: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .msg { margin-top: 16px; padding: 12px; border-radius: 6px; }
  .msg.success { background: #1b3b1b; color: #7fdc7f; }
  .msg.error { background: #3b1b1b; color: #ff8080; }
  .loading { text-align: center; padding: 40px; color: #777; }
</style>
</head>
<body>

<header>🎬 BookMyCinema</header>

<div class="container">

  <!-- LOGIN SECTION -->
  <div id="login-section" class="section active">
    <h2>Enter your details to book</h2>
    <input id="user-name" placeholder="Your name">
    <input id="user-email" placeholder="Email">
    <button onclick="registerUser()">Continue</button>
    <div id="login-msg"></div>
  </div>

  <!-- MOVIES SECTION -->
  <div id="movies-section" class="section">
    <h2>Now Showing</h2>
    <div class="movie-grid" id="movie-grid"></div>
  </div>

  <!-- SHOWS FOR A MOVIE -->
  <div id="shows-section" class="section">
    <button class="back-btn" onclick="showSection('movies-section')">← Back to movies</button>
    <h2 id="shows-movie-title"></h2>
    <div class="show-list" id="show-list"></div>
  </div>

  <!-- SEATS SECTION -->
  <div id="seats-section" class="section">
    <button class="back-btn" onclick="showSection('shows-section')">← Back to showtimes</button>
    <h2 id="show-title"></h2>
    <div class="screen-label">SCREEN THIS WAY</div>
    <div class="seat-map-wrapper" id="seat-map"></div>
    <div class="legend">
      <span><span class="box" style="background:#2a2e37;border:1px solid #3a3f4a;"></span> Available</span>
      <span><span class="box" style="background:#e50914;"></span> Selected</span>
      <span><span class="box" style="background:#333;"></span> Booked</span>
    </div>
    <div class="summary">
      <div>Selected seats: <span id="selected-count">0</span> | Total: ₹<span id="total-price">0</span></div>
      <button onclick="confirmBooking()">Confirm Booking</button>
    </div>
    <div id="booking-msg"></div>
  </div>

</div>

<script>
const API = "https://bookmycinema-tpc6.onrender.com/api";
let currentUser = null;
let currentShow = null;
let selectedSeats = [];
let allShows = [];

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function registerUser() {
  const name = document.getElementById('user-name').value.trim();
  const email = document.getElementById('user-email').value.trim();
  if (!name || !email) {
    document.getElementById('login-msg').innerHTML = '<div class="msg error">Please fill both fields</div>';
    return;
  }
  document.getElementById('login-msg').innerHTML = '<div class="loading">Connecting... (may take 30-60s if server was asleep)</div>';
  try {
    const res = await fetch(`${API}/users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password: "temp1234", role: "USER" })
    });
    const data = await res.json();
    currentUser = data;
    document.getElementById('login-msg').innerHTML = '';
    loadMovies();
    showSection('movies-section');
  } catch (err) {
    document.getElementById('login-msg').innerHTML = '<div class="msg error">Could not connect to server. Try again.</div>';
  }
}

async function loadMovies() {
  document.getElementById('movie-grid').innerHTML = '<div class="loading">Loading movies...</div>';
  const res = await fetch(`${API}/shows`);
  allShows = await res.json();

  // group shows by movie id
  const movieMap = {};
  allShows.forEach(show => {
    const m = show.movie;
    if (!movieMap[m.id]) movieMap[m.id] = { movie: m, shows: [] };
    movieMap[m.id].shows.push(show);
  });

  const grid = document.getElementById('movie-grid');
  grid.innerHTML = '';
  Object.values(movieMap).forEach(entry => {
    const m = entry.movie;
    const minPrice = Math.min(...entry.shows.map(s => s.price));
    const card = document.createElement('div');
    card.className = 'movie-card';
    card.innerHTML = `
      <img src="${m.imageUrl || 'https://placehold.co/300x450/1c1f26/white?text=' + encodeURIComponent(m.title)}" 
           onerror="this.src='https://placehold.co/300x450/1c1f26/white?text=${encodeURIComponent(m.title)}'">
      <div class="info">
        <h3>${m.title}</h3>
        <p>${m.genre} • ${m.language} • ${m.durationMinutes} min</p>
        <p class="price-tag">From ₹${minPrice}</p>
      </div>
    `;
    card.onclick = () => openShowsForMovie(entry.movie, entry.shows);
    grid.appendChild(card);
  });
}

function openShowsForMovie(movie, shows) {
  document.getElementById('shows-movie-title').innerText = movie.title;
  const list = document.getElementById('show-list');
  list.innerHTML = '';
  shows.forEach(show => {
    const item = document.createElement('div');
    item.className = 'show-item';
    item.innerHTML = `
      <div>
        <strong>${show.screen.theatre.name} — ${show.screen.name}</strong>
        <p>${new Date(show.showTime).toLocaleString()} • ₹${show.price} • ${show.screen.totalSeats} seats</p>
      </div>
      <button>Select Seats</button>
    `;
    item.onclick = () => openSeatSelection(show);
    list.appendChild(item);
  });
  showSection('shows-section');
}

async function openSeatSelection(show) {
  currentShow = show;
  selectedSeats = [];
  document.getElementById('show-title').innerText = `${show.movie.title} — ${show.screen.name} — ${new Date(show.showTime).toLocaleString()}`;
  document.getElementById('seat-map').innerHTML = '<div class="loading">Loading seats...</div>';
  showSection('seats-section');

  const res = await fetch(`${API}/seats`);
  const allSeats = await res.json();
  const seatsForScreen = allSeats.filter(s => s.screen.id === show.screen.id);

  // group by row letter (first char of seatNumber)
  const rows = {};
  seatsForScreen.forEach(seat => {
    const rowKey = seat.seatNumber.match(/^[A-Za-z]+/)[0];
    if (!rows[rowKey]) rows[rowKey] = [];
    rows[rowKey].push(seat);
  });

  const map = document.getElementById('seat-map');
  map.innerHTML = '';
  Object.keys(rows).sort().forEach(rowKey => {
    const rowSeats = rows[rowKey].sort((a, b) => {
      const numA = parseInt(a.seatNumber.replace(/^[A-Za-z]+/, ''));
      const numB = parseInt(b.seatNumber.replace(/^[A-Za-z]+/, ''));
      return numA - numB;
    });
    const rowDiv = document.createElement('div');
    rowDiv.className = 'seat-row';
    rowDiv.innerHTML = `<div class="row-label">${rowKey}</div>`;
    rowSeats.forEach(seat => {
      const seatDiv = document.createElement('div');
      seatDiv.className = 'seat-icon' + (seat.booked ? ' booked' : '');
      seatDiv.title = seat.seatNumber;
      seatDiv.innerText = seat.seatNumber.replace(/^[A-Za-z]+/, '');
      seatDiv.onclick = () => { if (!seat.booked) toggleSeat(seat, seatDiv); };
      rowDiv.appendChild(seatDiv);
    });
    map.appendChild(rowDiv);
  });

  updateSummary();
}

function toggleSeat(seat, div) {
  const idx = selectedSeats.findIndex(s => s.id === seat.id);
  if (idx > -1) {
    selectedSeats.splice(idx, 1);
    div.classList.remove('selected');
  } else {
    selectedSeats.push(seat);
    div.classList.add('selected');
  }
  updateSummary();
}

function updateSummary() {
  document.getElementById('selected-count').innerText = selectedSeats.length;
  document.getElementById('total-price').innerText = (selectedSeats.length * currentShow.price).toFixed(2);
}

async function confirmBooking() {
  if (selectedSeats.length === 0) {
    document.getElementById('booking-msg').innerHTML = '<div class="msg error">Select at least one seat</div>';
    return;
  }
  document.getElementById('booking-msg').innerHTML = '<div class="loading">Booking...</div>';
  try {
    const res = await fetch(`${API}/bookings`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userId: currentUser.id,
        showId: currentShow.id,
        seatIds: selectedSeats.map(s => s.id)
      })
    });
    if (!res.ok) {
      const err = await res.json();
      document.getElementById('booking-msg').innerHTML = `<div class="msg error">${err.message || 'Booking failed'}</div>`;
      return;
    }
    const data = await res.json();
    document.getElementById('booking-msg').innerHTML =
      `<div class="msg success">🎉 Booking confirmed! Status: ${data.status}, Total: ₹${data.totalAmount}</div>`;
  } catch (err) {
    document.getElementById('booking-msg').innerHTML = '<div class="msg error">Something went wrong</div>';
  }
}
</script>

</body>
</html>
