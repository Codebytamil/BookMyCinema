<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BookMyCinema</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f1115; color: #fff; }
  header { background: #e50914; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  .movie-card { background: #1c1f26; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .movie-card h3 { margin-bottom: 6px; }
  .movie-card p { color: #aaa; font-size: 14px; }
  button { background: #e50914; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #ff1f2c; }
  button:disabled { background: #444; cursor: not-allowed; }
  .section { display: none; }
  .section.active { display: block; }
  .seat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
  .seat { padding: 14px; text-align: center; border-radius: 6px; background: #2a2e37; cursor: pointer; }
  .seat.booked { background: #444; color: #777; cursor: not-allowed; }
  .seat.selected { background: #e50914; }
  .back-btn { background: transparent; border: 1px solid #666; margin-bottom: 16px; }
  .summary { background: #1c1f26; padding: 16px; border-radius: 8px; margin-top: 16px; }
  .msg { margin-top: 16px; padding: 12px; border-radius: 6px; }
  .msg.success { background: #1b3b1b; color: #7fdc7f; }
  .msg.error { background: #3b1b1b; color: #ff8080; }
  input { padding: 8px; border-radius: 6px; border: none; margin: 6px 0; width: 100%; }
</style>
</head>
<body>

<header>🎬 BookMyCinema</header>

<div class="container">

  <!-- LOGIN SECTION -->
  <div id="login-section" class="section active">
    <h2>Enter your details to book</h2>
    <input id="user-name" placeholder="Your name">
    <input id="user-email" placeholder="Email">
    <button onclick="registerUser()">Continue</button>
    <div id="login-msg"></div>
  </div>

  <!-- MOVIES SECTION -->
  <div id="movies-section" class="section">
    <h2>Now Showing</h2>
    <div id="movie-list"></div>
  </div>

  <!-- SEATS SECTION -->
  <div id="seats-section" class="section">
    <button class="back-btn" onclick="showSection('movies-section')">← Back to movies</button>
    <h2 id="show-title"></h2>
    <div class="seat-grid" id="seat-grid"></div>
    <div class="summary">
      Selected seats: <span id="selected-count">0</span> |
      Total: ₹<span id="total-price">0</span>
    </div>
    <button onclick="confirmBooking()" style="margin-top:14px;">Confirm Booking</button>
    <div id="booking-msg"></div>
  </div>

</div>

<script>
const API = "https://bookmycinema-tpc6.onrender.com/api";
let currentUser = null;
let currentShow = null;
let selectedSeats = [];
let allSeats = [];

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function registerUser() {
  const name = document.getElementById('user-name').value.trim();
  const email = document.getElementById('user-email').value.trim();
  if (!name || !email) {
    document.getElementById('login-msg').innerHTML = '<div class="msg error">Please fill both fields</div>';
    return;
  }
  document.getElementById('login-msg').innerHTML = 'Connecting... (may take 30s if server was asleep)';
  try {
    const res = await fetch(`${API}/users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password: "temp1234", role: "USER" })
    });
    const data = await res.json();
    currentUser = data;
    document.getElementById('login-msg').innerHTML = '';
    loadMovies();
    showSection('movies-section');
  } catch (err) {
    document.getElementById('login-msg').innerHTML = '<div class="msg error">Could not connect to server</div>';
  }
}

async function loadMovies() {
  const res = await fetch(`${API}/shows`);
  const shows = await res.json();
  const list = document.getElementById('movie-list');
  list.innerHTML = '';
  shows.forEach(show => {
    const card = document.createElement('div');
    card.className = 'movie-card';
    card.innerHTML = `
      <div>
        <h3>${show.movie.title}</h3>
        <p>${show.movie.genre} • ${show.movie.durationMinutes} min • ${show.screen.theatre.name}</p>
        <p>${new Date(show.showTime).toLocaleString()} • ₹${show.price}</p>
      </div>
      <button onclick='openSeatSelection(${JSON.stringify(show).replace(/'/g, "&apos;")})'>Book</button>
    `;
    list.appendChild(card);
  });
}

async function openSeatSelection(show) {
  currentShow = show;
  selectedSeats = [];
  document.getElementById('show-title').innerText = `${show.movie.title} - ${new Date(show.showTime).toLocaleString()}`;
  const res = await fetch(`${API}/seats`);
  allSeats = await res.json();
  const seatsForScreen = allSeats.filter(s => s.screen.id === show.screen.id);
  const grid = document.getElementById('seat-grid');
  grid.innerHTML = '';
  seatsForScreen.forEach(seat => {
    const div = document.createElement('div');
    div.className = 'seat' + (seat.booked ? ' booked' : '');
    div.innerText = seat.seatNumber;
    div.onclick = () => { if (!seat.booked) toggleSeat(seat, div); };
    grid.appendChild(div);
  });
  updateSummary();
  showSection('seats-section');
}

function toggleSeat(seat, div) {
  const idx = selectedSeats.findIndex(s => s.id === seat.id);
  if (idx > -1) {
    selectedSeats.splice(idx, 1);
    div.classList.remove('selected');
  } else {
    selectedSeats.push(seat);
    div.classList.add('selected');
  }
  updateSummary();
}

function updateSummary() {
  document.getElementById('selected-count').innerText = selectedSeats.length;
  document.getElementById('total-price').innerText = (selectedSeats.length * currentShow.price).toFixed(2);
}

async function confirmBooking() {
  if (selectedSeats.length === 0) {
    document.getElementById('booking-msg').innerHTML = '<div class="msg error">Select at least one seat</div>';
    return;
  }
  document.getElementById('booking-msg').innerHTML = 'Booking...';
  try {
    const res = await fetch(`${API}/bookings`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userId: currentUser.id,
        showId: currentShow.id,
        seatIds: selectedSeats.map(s => s.id)
      })
    });
    if (!res.ok) {
      const err = await res.json();
      document.getElementById('booking-msg').innerHTML = `<div class="msg error">${err.message || 'Booking failed'}</div>`;
      return;
    }
    const data = await res.json();
    document.getElementById('booking-msg').innerHTML =
      `<div class="msg success">Booking confirmed! Status: ${data.status}, Total: ₹${data.totalAmount}</div>`;
  } catch (err) {
    document.getElementById('booking-msg').innerHTML = '<div class="msg error">Something went wrong</div>';
  }
}
</script>

</body>
</html>
